job:
  # Identity / audit (id, created_at set by Konor Center, not user)
  id: "auto-generated"
  name: "Human readable description"
  author: "user-or-service"
  created_at: "auto-timestamp"

  # What is being done
  operation: "UPDATE_CONFIGSET"   # closed set at MVP

  # Where it applies (target)
  scope:
    group: null           # e.g. "prod"
    configset: null       # e.g. "db-pool"
    key: null             # optional, for fine-grained key ops
    policy: null          # for policy operations
    token: null           # for token operations (revoke, rotate)

  # Data (interpreted by operation semantics)
  payload:
    # For config operations
    changes: {}           # for UPDATE_* (key → new value)
    values: {}            # for CREATE_* (initial config or metadata)

    # For group/policy ops
    configsets: []        # list of configset IDs for group
    policy: null          # policy uid to attach/use

    # Free space for future use (safe to ignore in MVP)
    flags: {}             # small knobs / operation-specific extras

  # Rollout behavior across nodes
  strategy:
    type: "ALL | QUORUM | BATCH | EVENTUAL"

    batch:                # used only when type == BATCH
      size: null          # int: nodes per batch
      wait_seconds: null  # int: sleep between batches

    quorum:               # used when type == QUORUM or BATCH+quorum
      threshold: null     # e.g. 0.8 (80% of live nodes)

    # For MVP: constraints not implemented yet
    constraints: {}       # reserved for Ultimate (metrics-based canaries)

  # Optional tags for logging / UI / filtering
  metadata:
    labels: {}            # e.g. env: prod, team: payments
    annotations: {}       # comments, trace ids, etc